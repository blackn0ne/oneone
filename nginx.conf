# Конфигурация Nginx для Laravel + Inertia + Vite
# Для домена one.one (центральная панель)
# 
# Скопируй этот конфиг в папку конфигов Nginx (обычно в OSPanel это что-то вроде)
# C:/OSPanel/modules/nginx/conf/vhosts/one.one.conf
# или добавь в основной nginx.conf в блок http { }

# HTTP -> HTTPS редирект (если нужен)
server {
    listen      80;
    server_name one.one;
    return 301 https://$host$request_uri;
}

# Основной HTTPS сервер
server {
    listen      443 ssl http2;
    server_name one.one;

    # ВАЖНО: root указывает на папку public, но в URL /public/ не будет
    root        C:/OSPanel/home/one.one/public;
    index       index.php index.html;

    # SSL сертификаты (подставь свои пути)
    # Для локальной разработки можно использовать самоподписанные
    ssl_certificate     C:/OSPanel/userdata/ssl_cert/one.one.crt;
    ssl_certificate_key C:/OSPanel/userdata/ssl_cert/one.one.key;
    
    # SSL настройки
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логи
    access_log  C:/OSPanel/logs/nginx/one.one.access.log;
    error_log   C:/OSPanel/logs/nginx/one.one.error.log;

    # Блокируем доступ к /public/ как к URL (редирект на корень)
    location = /public {
        return 301 /;
    }
    
    location = /public/ {
        return 301 /;
    }

    # Статические файлы из public (build, storage, favicon и т.д.)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite HMR (только для разработки, в продакшене можно убрать)
    location /build/ {
        try_files $uri =404;
    }

    # Storage симлинк
    location /storage {
        alias C:/OSPanel/home/one.one/storage/app/public;
        try_files $uri =404;
    }

    # Основной location для Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP обработка
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   127.0.0.1:9000;  # или unix:/path/to/php-fpm.sock
        fastcgi_index  index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        
        # Важно для HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
    }

    # Блокируем доступ к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Блокируем доступ к файлам конфигурации
    location ~ \.(env|git|svn|htaccess|htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
